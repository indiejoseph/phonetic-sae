[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "phonetic-sae"
version = "0.1.0"
description = "Mechanistic interpretability for phonetic layers in LLM-based TTS using Sparse Autoencoders"
readme = "CLAUDE.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Joseph Cheng", email = "indiejoseph@gmail.com"},
]

dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "transformers>=4.40",
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.60",
    "pyyaml>=6.0",
    "wandb>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]
viz = [
    "streamlit>=1.30",
    "plotly>=5.18",
]
eval = [
    "openai-whisper>=20231117",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
